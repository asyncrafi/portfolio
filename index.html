    <script>
      (function() {
        function initFloatingNav() {
          const mobileNav = document.getElementById('floating-bottom-nav');
          const desktopRail = document.getElementById('desktop-side-rail');
          const mobileItems = mobileNav ? Array.from(mobileNav.querySelectorAll('.floating-nav-item')) : [];
          const desktopItems = desktopRail ? Array.from(desktopRail.querySelectorAll('.side-rail-item')) : [];
          const brandBtn = desktopRail ? (desktopRail.querySelector('.side-rail-flower-link') || desktopRail.querySelector('.side-rail-brand')) : null;
          const scrollBtn = desktopRail ? desktopRail.querySelector('.side-rail-scroll') : null;
          const compassNeedle = brandBtn ? brandBtn.querySelector('.compass-needle') : null;
          let isBursting = false;

          function bindSmoothScroll(elements) {
            elements.forEach(item => {
              item.addEventListener('click', function(e) {
                e.preventDefault();
                const targetId = this.getAttribute('href');
                const targetEl = document.querySelector(targetId);
                if (targetEl) {
                  targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
                  const sec = this.getAttribute('data-section');
                  if (sec) setActive(sec);
                }
              });
            });
          }

          bindSmoothScroll(mobileItems);
          bindSmoothScroll(desktopItems);

          function smoothScrollSlow(targetY, duration = 1500) {
            if (window.lenis && typeof window.lenis.scrollTo === 'function') {
              window.lenis.scrollTo(targetY, {
                duration: duration / 1000,
                easing: (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2
              });
              return;
            }

            const startY = window.scrollY || window.pageYOffset || 0;
            const distance = targetY - startY;
            if (Math.abs(distance) < 2) return;
            const startTime = performance.now();

            function step(currentTime) {
              const elapsed = currentTime - startTime;
              const progress = Math.min(elapsed / duration, 1);
              const ease = progress < 0.5
                ? 4 * progress * progress * progress
                : 1 - Math.pow(-2 * progress + 2, 3) / 2;
              window.scrollTo(0, startY + distance * ease);
              if (progress < 1) {
                requestAnimationFrame(step);
              }
            }
            requestAnimationFrame(step);
          }

          function handleCompassClick(e, needle, getBursting, setBursting) {
            e.preventDefault();
            if (!getBursting() && needle) {
              setBursting(true);
              needle.classList.remove('is-burst');
              void needle.offsetWidth;
              needle.classList.add('is-burst');
              setTimeout(() => {
                needle.classList.remove('is-burst');
                setBursting(false);
              }, 1100);
            }
          }

          if (brandBtn) {
            brandBtn.addEventListener('click', function(e) {
              handleCompassClick(e, compassNeedle, () => isBursting, (v) => { isBursting = v; });
            });
          }

          const mobileCompassBtn = document.getElementById('mobile-nav-compass-btn');
          const mobileCompassNeedle = mobileCompassBtn ? mobileCompassBtn.querySelector('.compass-needle') : null;
          let isMobileBursting = false;
          if (mobileCompassBtn) {
            mobileCompassBtn.addEventListener('click', function(e) {
              handleCompassClick(e, mobileCompassNeedle, () => isMobileBursting, (v) => { isMobileBursting = v; });
            });
          }

          if (scrollBtn) {
            function getScrollTargets() {
              const ids = ['center', 'statement', 'experience', 'skills', 'projects', 'contact'];
              const targets = [];
              ids.forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                  const rect = el.getBoundingClientRect();
                  targets.push({ id, top: window.scrollY + rect.top, el });
                }
              });
              targets.sort((a, b) => a.top - b.top);
              return targets;
            }

            scrollBtn.addEventListener('click', function(e) {
              e.preventDefault();
              const scrollY = window.scrollY || window.pageYOffset || 0;
              const maxScroll = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
              const isUpMode = scrollBtn.classList.contains('is-scroll-up');

              if (isUpMode) {
                // Smooth slow scroll back to top
                smoothScrollSlow(0, 1600);
                setActive('center');
              } else {
                // Smooth slow scroll to next section down
                const targets = getScrollTargets();
                let nextTarget = null;
                for (let t of targets) {
                  if (t.top > scrollY + 80) {
                    nextTarget = t;
                    break;
                  }
                }
                if (nextTarget) {
                  smoothScrollSlow(nextTarget.top, 1500);
                  const mapped = sectionMap.find(m => m.id === nextTarget.id);
                  if (mapped) setActive(mapped.navId);
                } else {
                  smoothScrollSlow(maxScroll, 1500);
                }
              }
            });
          }

          const sectionMap = [
            { id: 'center', navId: 'center' },
            { id: 'statement', navId: 'center' },
            { id: 'skills', navId: 'experience' },
            { id: 'experience', navId: 'experience' },
            { id: 'projects', navId: 'projects' },
            { id: 'contact', navId: 'contact' }
          ];

          function updateNavState() {
            const scrollY = window.scrollY || window.pageYOffset || 0;
            const isDesktop = window.innerWidth > 1024;
            const maxScroll = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
            const scrollProgress = Math.min(1, Math.max(0, scrollY / maxScroll));

            // Dynamic Compass Progress Indicator (Rotates needle from 0deg to 360deg based on scroll)
            const compassAngle = (scrollProgress * 360).toFixed(1);
            document.documentElement.style.setProperty('--compass-angle', `${compassAngle}deg`);

            if (isDesktop && desktopRail) {
              // Desktop Contrast Detection: Probe directly under the center of the side rail
              const probeX = 90;
              const probeY = window.innerHeight * 0.5;
              const probedEl = document.elementFromPoint(probeX, probeY);
              const isOverLight = !!(probedEl && probedEl.closest('#statement, #experience, #contact'));

              if (isOverLight) {
                desktopRail.classList.add('is-on-light');
                desktopRail.classList.remove('is-on-dark');
              } else {
                desktopRail.classList.add('is-on-dark');
                desktopRail.classList.remove('is-on-light');
              }

              // Desktop Side Rail Scroll Button State (Down vs Up)
              if (scrollBtn) {
                const maxScroll = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
                const scrollProgress = scrollY / maxScroll;
                const scrollText = scrollBtn.querySelector('.side-rail-scroll-text');
                const isNearBottom = scrollProgress >= 0.58 || (scrollY + window.innerHeight >= document.documentElement.scrollHeight - 160);

                if (isNearBottom) {
                  if (!scrollBtn.classList.contains('is-scroll-up')) {
                    scrollBtn.classList.add('is-scroll-up');
                    scrollBtn.setAttribute('aria-label', 'Scroll up to top');
                    if (scrollText) scrollText.textContent = 'SCROLL UP';
                  }
                } else {
                  if (scrollBtn.classList.contains('is-scroll-up')) {
                    scrollBtn.classList.remove('is-scroll-up');
                    scrollBtn.setAttribute('aria-label', 'Scroll down');
                    if (scrollText) scrollText.textContent = 'SCROLL DOWN';
                  }
                }
              }
            } else if (!isDesktop && mobileNav) {
              // Mobile Contrast Detection: Probe directly above the docked bottom app bar
              const navRect = mobileNav.getBoundingClientRect();
              const probeY = Math.max(10, navRect.top - 12);
              const probeX = Math.round(window.innerWidth * 0.5);
              const probedEl = document.elementFromPoint(probeX, probeY);

              const isOverLight = !!(probedEl && probedEl.closest('#statement, #experience, #contact'));

              if (isOverLight) {
                mobileNav.classList.add('is-on-light');
                mobileNav.classList.remove('is-on-dark');
              } else {
                mobileNav.classList.add('is-on-dark');
                mobileNav.classList.remove('is-on-light');
              }

              // Mobile Hero Scroll Hint Fade Out
              const scrollHint = document.querySelector('.hero-scroll-hint');
              if (scrollHint) {
                if (scrollY > 8) {
                  scrollHint.classList.add('is-hidden');
                } else {
                  scrollHint.classList.remove('is-hidden');
                }
              }

              // Mobile Experience Timeline Active Years & Marker
              const expSection = document.getElementById('experience');
              if (expSection) {
                const expItems = Array.from(expSection.querySelectorAll('.experience-item'));
                const midScreen = window.innerHeight * 0.5;
                let closestIndex = -1;
                let minDistance = Infinity;

                expItems.forEach((item, idx) => {
                  const rect = item.getBoundingClientRect();
                  if (rect.top < window.innerHeight * 0.88 && rect.bottom > 0) {
                    item.classList.add('is-revealed');
                  }
                  const itemMid = rect.top + rect.height * 0.35;
                  const dist = Math.abs(itemMid - midScreen);
                  if (dist < minDistance) {
                    minDistance = dist;
                    closestIndex = idx;
                  }
                });

                if (closestIndex !== -1) {
                  expItems.forEach((item, idx) => {
                    const yearEl = item.querySelector('.experience-year');
                    const isActive = idx === closestIndex;
                    item.classList.toggle('is-active', isActive);
                    if (yearEl) {
                      yearEl.classList.toggle('is-active', isActive);
                    }
                  });

                  const activeItem = expItems[closestIndex];
                  const marker = expSection.querySelector('.experience-progress-marker');
                  if (marker && activeItem) {
                    const timelineEl = expSection.querySelector('.experience-timeline');
                    const timelineRect = (timelineEl || expSection).getBoundingClientRect();
                    const yearEl = activeItem.querySelector('.experience-year') || activeItem;
                    const yearRect = yearEl.getBoundingClientRect();
                    const markerTop = Math.max(12, yearRect.top - timelineRect.top + 10);
                    timelineEl?.style.setProperty('--experience-marker-top', `${markerTop}px`);
                  }
                }
              }
            }

            // Scroll Spy for Navigation Items (Synchronizes both Mobile and Desktop)
            if (scrollY < 120) {
              setActive('center');
              return;
            }

            const scrollBottom = window.innerHeight + scrollY;
            const docHeight = document.documentElement.scrollHeight;
            if (docHeight > window.innerHeight + 300 && scrollBottom >= docHeight - 120) {
              setActive('contact');
              return;
            }

            const scrollMid = scrollY + window.innerHeight * 0.4;
            let activeNav = 'center';

            for (const item of sectionMap) {
              const el = document.getElementById(item.id);
              if (el) {
                const top = el.offsetTop;
                const height = el.offsetHeight;
                if (scrollMid >= top && scrollMid < top + height) {
                  activeNav = item.navId;
                }
              }
            }
            setActive(activeNav);
          }

          function setActive(sectionId) {
            mobileItems.forEach(item => {
              item.classList.toggle('is-active', item.getAttribute('data-section') === sectionId);
            });
            desktopItems.forEach(item => {
              item.classList.toggle('is-active', item.getAttribute('data-section') === sectionId);
            });
          }

          let ticking = false;
          function requestTick() {
            if (!ticking) {
              requestAnimationFrame(() => {
                updateNavState();
                ticking = false;
              });
              ticking = true;
            }
          }

          window.addEventListener('scroll', requestTick, { passive: true });
          window.addEventListener('resize', requestTick, { passive: true });
          updateNavState();

          setTimeout(updateNavState, 200);
          setTimeout(updateNavState, 600);
          setTimeout(updateNavState, 1500);
          setTimeout(updateNavState, 3000);
        }

        // Contact Message Form Submit Handler (In-Button State Morphing)
        document.addEventListener('submit', function (e) {
          const form = e.target.closest('#contact-connect-form');
          if (!form) return;
          e.preventDefault();

          const submitBtn = form.querySelector('#connect-submit-btn');
          const nameInput = form.querySelector('#connect-name');
          const emailInput = form.querySelector('#connect-email');
          const msgInput = form.querySelector('#connect-message');

          if (!nameInput?.value.trim() || !emailInput?.value.trim() || !msgInput?.value.trim()) {
            if (submitBtn) {
              submitBtn.style.animation = 'connect-shake 0.4s ease';
              setTimeout(() => { submitBtn.style.animation = ''; }, 450);
            }
            return;
          }

          if (submitBtn) {
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="connect-btn-spinner" aria-hidden="true"></span><span class="connect-btn-text">Sending...</span>';
          }

          setTimeout(() => {
            if (submitBtn) {
              submitBtn.innerHTML = '<svg class="connect-btn-check" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1.8 14.2l-3.9-3.9 1.41-1.41 2.49 2.49 5.89-5.89 1.41 1.41-7.3 7.3z"/></svg><span class="connect-btn-text">Message Sent</span>';
            }
            form.reset();

            setTimeout(() => {
              if (submitBtn) {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span class="connect-btn-text">Send Message</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="connect-btn-arrow"><path d="M5 12h14M12 5l7 7-7 7"/></svg>';
              }
            }, 4000);
          }, 700);
        });

        // Download CV Click Handler
        document.addEventListener('click', function (e) {
          const cvBtn = e.target.closest('#connect-download-cv');
          if (!cvBtn) return;
          const href = cvBtn.getAttribute('href');
          if (!href || href === '#' || href === '#download-cv') {
            e.preventDefault();
            window.open('mailto:shamsuzzaman.rafi@gmail.com?subject=CV%20Request%20-%20Md%20Shamsuzzaman%20(Rafi)&body=Hi%20Rafi,%20I%20would%20love%20to%20review%20your%20CV/Resume.', '_blank');
          }
        });

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', initFloatingNav);
        } else {
          initFloatingNav();
        }
      })();
    </script>
